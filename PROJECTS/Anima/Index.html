<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psilocybe cubensis — Lifecycle</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="err-overlay" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;max-height:40vh;overflow:auto;background:rgba(0,0,0,0.92);color:#ff6b6b;font:12px/1.6 monospace;padding:12px 16px;border-top:2px solid #ff4444;pointer-events:auto;"></div>
    <script>
      (function(){
        var el=document.getElementById('err-overlay');
        function show(msg){el.style.display='block';el.innerHTML+='<div style="margin-bottom:6px;border-bottom:1px solid rgba(255,100,100,0.15);padding-bottom:6px;">'+msg+'</div>';}
        window.onerror=function(m,s,l,c,e){show('⛔ '+m+'<br><span style="color:#888">'+s+':'+l+':'+c+'</span>');};
        window.addEventListener('unhandledrejection',function(e){show('⛔ Promise: '+e.reason);});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
